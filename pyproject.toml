[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyric-mv-kit"
version = "0.1.0"
description = "Pure-Python kinetic lyric MV renderer (Pillow + numpy + ffmpeg)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ROYAZON / Zon", email = "royazon@zondev.top" },
]
keywords = ["video", "lyric", "music", "renderer", "ffmpeg", "pillow"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
align = ["openai-whisper", "stable-ts"]
separate = ["demucs"]
yaml = ["PyYAML>=6.0"]
all = ["openai-whisper", "stable-ts", "demucs", "PyYAML>=6.0"]

[project.scripts]
lyric-mv = "lyric_mv.cli:main"

[project.urls]
"Bili showcase"   = "https://space.bilibili.com/<uid>"
"Site"            = "https://music.zondev.top"
"Issues"          = "https://github.com/EOMZON/lyric-mv-kit/issues"

[tool.setuptools]
packages = ["lyric_mv"]

[tool.setuptools.package-data]
lyric_mv = ["py.typed"]